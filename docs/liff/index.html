<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลือกไพ่ – Black Cat Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15101f; --bg2:#221832; --gold:#d9b25f; --gold-soft:#d9b25f55;
    --text:#f3ead8; --muted:#b8a98c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Kanit",system-ui,sans-serif;font-weight:300}
  body{min-height:100vh;background:radial-gradient(ellipse at top,#2c1f44 0%,var(--bg) 60%) fixed}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  header img{width:52px;height:52px}
  h1{font-size:18px;font-weight:600;margin:0;color:var(--gold);letter-spacing:.3px}
  .hint{font-size:14px;color:var(--muted);margin:2px 0 0}

  .sticky{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:8px 16px 10px;box-shadow:0 8px 12px -8px #000a}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 auto 8px;max-width:330px}
  .slot{text-align:center}
  .slot .frame{aspect-ratio:410/612;border:1.5px dashed var(--gold-soft);border-radius:8px;position:relative;perspective:800px}
  .slot .label{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3}
  .slot .num{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold-soft);font-size:22px;font-weight:600}
  .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1)}
  .flip.open{transform:rotateY(180deg)}
  .flip img{position:absolute;inset:0;width:100%;height:100%;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;object-fit:cover}
  .flip .face{transform:rotateY(180deg)}
  .slot .name{font-size:11px;color:var(--gold);min-height:15px;margin-top:2px}

  .deckbar{display:flex;justify-content:space-between;align-items:center}
  .deckbar span{font-size:14px;color:var(--muted)}
  .deck{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
  @media (min-width:480px){.deck{grid-template-columns:repeat(9,1fr)}}
  .card{aspect-ratio:410/612;border-radius:5px;background:url(../cards/back.jpg) center/cover;box-shadow:0 2px 6px #0008;
        border:none;padding:0;cursor:pointer;transition:transform .15s,opacity .3s;animation:deal .4s backwards}
  .card:active{transform:translateY(-4px) scale(1.04)}
  .card.taken{opacity:0;pointer-events:none;transform:scale(.8)}
  @keyframes deal{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  .deck.locked .card{pointer-events:none;opacity:.35}
  .deck.hide{visibility:hidden}
  .deck.js .card{animation:none}

  /* เอฟเฟกต์สับไพ่ */
  .stage{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}
  .stage.on{display:block}
  .stage .glow{position:absolute;left:50%;top:56%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;
               background:radial-gradient(circle,#d9b25f33 0%,#7a4fc022 40%,transparent 70%);opacity:0}
  .stage .ring{position:absolute;left:50%;top:56%;width:0;height:0}
  .stage .sc{position:absolute;width:60px;aspect-ratio:410/612;left:-30px;top:-45px;border-radius:6px;
             background:url(../cards/back.jpg) center/cover;box-shadow:0 6px 16px #000b;border:1px solid #d9b25f66}
  .stage .msg{position:absolute;left:0;right:0;top:calc(56% + 170px);text-align:center;color:var(--gold);font-size:16px;opacity:0}
  .btn:disabled{opacity:.4}

  .btn{font:inherit;font-weight:400;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);padding:6px 14px;font-size:14px;cursor:pointer}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
       background:linear-gradient(transparent,var(--bg) 35%)}
  .main{display:block;width:100%;max-width:528px;margin:0 auto;font:inherit;font-size:17px;font-weight:600;padding:14px;border:none;border-radius:14px;
        background:var(--gold);color:#22180e;cursor:pointer;box-shadow:0 6px 18px #d9b25f40}
  .main:disabled{background:#4a3e5c;color:#9a8fac;box-shadow:none}
  .toast{margin:12px auto 0;max-width:528px;font-size:14px;color:var(--muted);white-space:pre-line;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../logo.png" alt="">
    <div>
      <h1>ตั้งจิตถึงคำถามของคุณ</h1>
      <p class="hint">แล้วแตะเลือกไพ่ 4 ใบที่ใจรู้สึกดึงดูดเหมียว 🐾</p>
    </div>
  </header>

  <div class="sticky">
    <div class="slots" id="slots"></div>
    <div class="deckbar">
      <span id="count">เลือกแล้ว 0/4</span>
      <button class="btn" id="shuffle">🔄 สับไพ่</button>
    </div>
  </div>
  <div class="deck" id="deck"></div>
  <p class="toast" id="toast"></p>
</div>

<div class="bar"><button class="main" id="action" disabled>เลือกไพ่อีก 4 ใบ</button></div>
<div class="stage" id="stage"><div class="glow"></div><div class="ring"></div><div class="msg">กำลังสับไพ่...เหมียว 🐾</div></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== ตั้งค่า: ใส่ LIFF ID ที่ได้จาก LINE Developers Console =====
const LIFF_ID = '2012780843-uakCkXhn';
// ===================================================================

const POSITIONS = ['สถานการณ์ตอนนี้', 'อุปสรรคหรือสิ่งที่ซ่อนอยู่', 'คำแนะนำ', 'แนวโน้มผลลัพธ์'];
const MESSAGE_PREFIX = '🔮 ไพ่ที่ฉันเลือก';

// รายชื่อไพ่ 78 ใบ ตรงกับชื่อไฟล์ใน cards/
const MAJORS = ['The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant',
  'The Lovers','The Chariot','Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death',
  'Temperance','The Devil','The Tower','The Star','The Moon','The Sun','Judgement','The World'];
const SUITS = {cups:'Cups', pent:'Pentacles', swords:'Swords', wands:'Wands'};
const RANKS = ['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
const CARDS = [];
MAJORS.forEach((n, i) => CARDS.push({id: 'maj_' + String(i).padStart(2, '0'), name: n}));
Object.entries(SUITS).forEach(([k, s]) => RANKS.forEach((r, i) =>
  CARDS.push({id: k + '_' + String(i + 1).padStart(2, '0'), name: r + ' of ' + s})));

const $ = id => document.getElementById(id);
let picked = [], revealed = false, testMode = false, busy = false;

function shuffle(a) {
  a = a.slice();
  const r = new Uint32Array(a.length);
  crypto.getRandomValues(r);
  for (let i = a.length - 1; i > 0; i--) { const j = r[i] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderSlots() {
  $('slots').innerHTML = POSITIONS.map((p, i) => {
    const c = picked[i];
    return `<div class="slot" data-i="${i}"><div class="frame">${c
      ? `<div class="flip ${revealed ? 'open' : ''}"><img src="../cards/back.jpg" alt=""><img class="face" src="../cards/${c.id}.jpg" alt="${c.name}"></div>`
      : `<div class="num">${i + 1}</div>`}</div>
      <div class="name">${revealed && c ? c.name : ''}</div><div class="label">${p}</div></div>`;
  }).join('');
}

function renderDeck() {
  const deck = shuffle(CARDS);
  $('deck').innerHTML = deck.map((c, i) =>
    `<button class="card" data-id="${c.id}" style="animation-delay:${Math.min(i * 8, 500)}ms" aria-label="ไพ่ใบที่ ${i + 1}"></button>`).join('');
}

// ---------- เอฟเฟกต์สับไพ่: รวมกอง → กางเป็นวง → หมุนวน → รวบกอง → สับ → แจกไพ่ ----------
const anim = (el, frames, opt) => el.animate(frames, Object.assign({fill: 'forwards'}, opt)).finished;
const all = (els, fn) => Promise.all(els.map(fn));

async function shuffleWithEffect() {
  if (busy || revealed) return;
  busy = true;
  picked = []; update();
  $('shuffle').disabled = true;
  const deck = $('deck');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { renderDeck(); deck.classList.remove('js', 'hide'); busy = false; $('shuffle').disabled = false; return; }

  window.scrollTo({top: 0, behavior: 'smooth'});
  deck.classList.add('hide');
  const stage = $('stage'), ring = stage.querySelector('.ring'), glow = stage.querySelector('.glow'), msg = stage.querySelector('.msg');
  const N = 18, R = Math.min(window.innerWidth * 0.3, 125);
  ring.innerHTML = Array.from({length: N}, () => '<div class="sc"></div>').join('');
  const sc = [...ring.children];
  const jitter = () => (Math.random() * 10 - 5).toFixed(1);
  stage.classList.add('on');
  ring.getAnimations().forEach(a => a.cancel());

  try {
    // 1) ไพ่รวมเป็นกองกลางจอ
    anim(glow, [{opacity: 0}, {opacity: 1}], {duration: 400});
    anim(msg, [{opacity: 0}, {opacity: 1}], {duration: 400});
    await all(sc, (el, i) => anim(el,
      [{opacity: 0, transform: `translateY(40px) scale(.6) rotate(${jitter()}deg)`},
       {opacity: 1, transform: `translateY(${-i * 0.6}px) rotate(${jitter()}deg)`}],
      {duration: 260, delay: i * 12, easing: 'ease-out'}));

    // 2) กางออกเป็นวงกลม
    await all(sc, (el, i) => anim(el,
      [{transform: `translateY(${-i * 0.6}px) rotate(0deg)`},
       {transform: `rotate(${360 * i / N}deg) translateY(${-R}px)`}],
      {duration: 550, easing: 'cubic-bezier(.2,.8,.2,1)'}));

    // 3) หมุนวน
    if (navigator.vibrate) navigator.vibrate([20, 60, 20, 60, 20]);
    await anim(ring, [{transform: 'rotate(0deg)'}, {transform: 'rotate(720deg)'}],
      {duration: 1200, easing: 'cubic-bezier(.45,0,.2,1)'});

    // 4) รวบกลับเป็นกอง
    await all(sc, (el, i) => anim(el,
      [{transform: `rotate(${360 * i / N}deg) translateY(${-R}px)`},
       {transform: `rotate(${720 + Number(jitter())}deg) translateY(0)`}],
      {duration: 380, easing: 'ease-in'}));

    // 5) สับแบบแยกกองซ้ายขวาแล้วรวม 2 รอบ
    for (let k = 0; k < 2; k++) {
      await all(sc, (el, i) => anim(el,
        [{transform: 'rotate(0deg) translate(0,0)'},
         {transform: `rotate(${i % 2 ? 8 : -8}deg) translate(${i % 2 ? 46 : -46}px, ${-i * 0.5}px)`},
         {transform: `rotate(${jitter()}deg) translate(0, ${-i * 0.6}px)`}],
        {duration: 360, delay: (i % 2 ? i : N - i) * 6, easing: 'ease-in-out'}));
    }
    anim(glow, [{opacity: 1}, {opacity: 0}], {duration: 300});
    anim(msg, [{opacity: 1}, {opacity: 0}], {duration: 200});
  } catch (e) { /* ข้ามเอฟเฟกต์ถ้าเบราว์เซอร์ไม่รองรับ */ }

  // 6) แจกไพ่จากกองกลางจอลงตาราง
  const ringBox = ring.getBoundingClientRect();
  stage.classList.remove('on');
  renderDeck();
  deck.classList.add('js');
  deck.classList.remove('hide');
  const cards = [...deck.children];
  cards.forEach((el, i) => {
    const b = el.getBoundingClientRect();
    const dx = ringBox.left - (b.left + b.width / 2), dy = ringBox.top - (b.top + b.height / 2);
    el.animate([{transform: `translate(${dx}px, ${dy}px) scale(.6) rotate(${jitter()}deg)`, opacity: 0},
                {opacity: 1, offset: 0.15},
                {transform: 'none', opacity: 1}],
      {duration: 420, delay: Math.min(i * 9, 650), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards'});
  });
  setTimeout(() => { busy = false; $('shuffle').disabled = false; update(); }, 750);
}

function update() {
  $('count').textContent = `เลือกแล้ว ${picked.length}/4`;
  $('deck').classList.toggle('locked', picked.length >= 4);
  const btn = $('action');
  if (picked.length < 4) { btn.disabled = true; btn.textContent = `เลือกไพ่อีก ${4 - picked.length} ใบ`; }
  else if (!revealed) { btn.disabled = false; btn.textContent = 'เปิดไพ่ ✨'; }
  else { btn.disabled = false; btn.textContent = 'ส่งให้แม่หมอเหมียวทำนาย 🐾'; }
  $('shuffle').style.visibility = revealed ? 'hidden' : 'visible';
  renderSlots();
}

$('deck').addEventListener('click', e => {
  const el = e.target.closest('.card');
  if (!el || busy || picked.length >= 4 || revealed) return;
  picked.push(CARDS.find(c => c.id === el.dataset.id));
  el.classList.add('taken');
  if (navigator.vibrate) navigator.vibrate(15);
  update();
});

// แตะไพ่ในช่องเพื่อคืนไพ่ (ก่อนเปิดไพ่เท่านั้น)
$('slots').addEventListener('click', e => {
  const slot = e.target.closest('.slot');
  if (!slot || revealed) return;
  const c = picked[+slot.dataset.i];
  if (!c) return;
  picked.splice(+slot.dataset.i, 1);
  const el = document.querySelector(`.card[data-id="${c.id}"]`);
  if (el) el.classList.remove('taken');
  update();
});

$('shuffle').addEventListener('click', shuffleWithEffect);

$('action').addEventListener('click', async () => {
  if (picked.length < 4) return;
  if (!revealed) {
    picked.forEach(c => { new Image().src = `../cards/${c.id}.jpg`; });
    revealed = true; update();
    window.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }
  const text = MESSAGE_PREFIX + '\n' + picked.map((c, i) => `${i + 1}. ${c.name}`).join('\n');
  const btn = $('action');
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  if (testMode) {
    $('toast').textContent = '(โหมดทดสอบ) ข้อความที่จะส่งเข้าแชต:\n' + text;
    btn.disabled = false; btn.textContent = 'ส่งให้แม่หมอเหมียวทำนาย 🐾';
    return;
  }
  try {
    await liff.sendMessages([{type: 'text', text}]);
    liff.closeWindow();
  } catch (err) {
    $('toast').textContent = 'ส่งไม่สำเร็จเหมียว 😿 กรุณาเปิดหน้านี้จากปุ่มในแชต LINE แล้วลองใหม่\n(' + (err.message || err) + ')';
    btn.disabled = false; btn.textContent = 'ลองส่งอีกครั้ง';
  }
});

(async function init() {
  update();
  shuffleWithEffect();
  testMode = new URLSearchParams(location.search).has('test') || LIFF_ID.startsWith('PUT_');
  if (testMode) { $('toast').textContent = 'โหมดทดสอบ: เปิดนอก LINE จะยังไม่ส่งข้อความจริง'; return; }
  try {
    await liff.init({liffId: LIFF_ID});
    if (!liff.isInClient()) $('toast').textContent = 'กรุณาเปิดหน้านี้จากปุ่มในแชต LINE เหมียว';
  } catch (err) {
    $('toast').textContent = 'เชื่อมต่อ LINE ไม่สำเร็จ: ' + (err.message || err);
  }
})();
</script>
</body>
</html>
